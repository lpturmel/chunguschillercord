[package]
name = "chunguschillercord"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenv = "0.15.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
ron = "0.12.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
turso = { version = "0.8.0-pre.3", default-features = false, features = ["sync", "pure-rust-crypto"] }
twilight-http = "0.17.1"
twilight-model = "0.17.1"
