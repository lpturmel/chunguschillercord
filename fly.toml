app = "chunguschillercord"
primary_region = "yyz"

[build]

[env]
  PORT = "8080"
  CHUNGUSCHILLERCORD_DATABASE_PATH = "/data/chunguschillercord.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "chunguschillercord_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
